<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rudrax Cinema — Online Booking</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b0b10;color:#fff}
header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;background:#11111a;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:800}.logo span{color:#e50914}
main{max-width:1050px;margin:30px auto;padding:0 18px}.hero{background:linear-gradient(135deg,#1c1c2a,#100b10);padding:28px;border-radius:20px}
h1{margin:0 0 8px;font-size:36px}.muted{color:#aaa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.card{background:#15151e;border:1px solid #292936;border-radius:16px;padding:20px}label{display:block;margin:12px 0 6px;color:#ccc}
input,select{width:100%;padding:13px;border-radius:10px;border:1px solid #3a3a46;background:#0f0f16;color:#fff}
.seats{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:12px}.seat{padding:10px 3px;border:1px solid #3c3c49;background:#191923;color:#fff;border-radius:7px;cursor:pointer}.seat.selected{background:#e50914;border-color:#e50914}.seat.booked{background:#4b4b55;color:#888;cursor:not-allowed}
button{border:0;border-radius:11px;padding:14px 18px;background:#e50914;color:white;font-weight:800;cursor:pointer}.full{width:100%;margin-top:18px}
.summary{display:flex;justify-content:space-between;margin-top:15px;font-size:18px}.success{display:none;text-align:center}.success .code{font-size:30px;font-weight:900;color:#58e37a;margin:12px 0}
@media(max-width:700px){.grid{grid-template-columns:1fr}.seats{grid-template-columns:repeat(5,1fr)}h1{font-size:29px}}
</style></head>
<body>
<header><div class="logo">🎬 RUDRAX <span>CINEMA</span></div><div class="muted">Una, Gujarat</div></header>
<main>
<section class="hero"><h1>Book Your Movie Tickets</h1><div class="muted">Choose show, seats and pay securely online.</div></section>
<div id="bookingArea" class="grid">
<section class="card">
<h2>1. Show Details</h2>
<label>Name</label><input id="name" placeholder="Your name">
<label>Mobile</label><input id="phone" placeholder="10 digit mobile number">
<label>Email (optional)</label><input id="email" type="email" placeholder="you@example.com">
<label>Show Date</label><input id="date" type="date">
<label>Show Time</label><select id="time"><option>12:00 PM - 03:00 PM</option><option>03:00 PM - 06:00 PM</option><option>06:00 PM - 09:00 PM</option><option>09:00 PM - 12:00 AM</option></select>
</section>
<section class="card">
<h2>2. Select Seats</h2><div class="muted">₹150 per seat</div><div id="seats" class="seats"></div>
<div class="summary"><span>Selected</span><b id="count">0</b></div><div class="summary"><span>Total</span><b>₹<span id="total">0</span></b></div>
<button id="pay" class="full">Pay & Confirm Booking</button>
</section>
</div>
<section id="success" class="card success">
<h2>🎉 Booking Confirmed</h2><div>Your payment has been verified and your ticket is booked.</div>
<div class="code" id="bookingCode"></div><div id="ticketInfo" class="muted"></div>
<button class="full" onclick="location.reload()">Book Another Ticket</button>
</section>
</main>
<script>
const PRICE=150, rows=["A","B","C","D","E","F"], cols=8; let selected=[];
const seatBox=document.getElementById("seats"), dateEl=document.getElementById("date");
dateEl.min=new Date().toISOString().slice(0,10); dateEl.value=dateEl.min;
function render(){seatBox.innerHTML=""; for(const r of rows)for(let c=1;c<=cols;c++){const id=r+c,b=document.createElement("button");b.className="seat"+(selected.includes(id)?" selected":"");b.textContent=id;b.type="button";b.onclick=()=>{selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];render();};seatBox.appendChild(b)}document.getElementById("count").textContent=selected.length;document.getElementById("total").textContent=selected.length*PRICE}
render();

async function createOrder(){
 const name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),email=document.getElementById("email").value.trim(),showDate=dateEl.value,showTime=document.getElementById("time").value;
 if(!name||!/^[0-9]{10}$/.test(phone)||!showDate||!selected.length)return alert("Please enter valid name, 10-digit mobile, date and select seats.");
 const r=await fetch("/api/bookings/create-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,phone,email,showDate,showTime,seats:selected,amount:selected.length*PRICE})});
 const data=await r.json(); if(!r.ok)throw new Error(data.error||"Could not create order");
 const options={key:data.keyId,amount:data.amount*100,currency:data.currency,name:"Rudrax Cinema",description:`Cinema ticket booking ${data.bookingId}`,order_id:data.orderId,prefill:{name,email,contact:"+91"+phone},theme:{color:"#e50914"},
 handler:async function(response){
   const vr=await fetch("/api/payment/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({bookingId:data.bookingId,...response})});
   const out=await vr.json(); if(!vr.ok) return alert(out.error||"Payment verification failed.");
   document.getElementById("bookingArea").style.display="none";document.getElementById("success").style.display="block";
   document.getElementById("bookingCode").textContent=out.booking.booking_id;
   document.getElementById("ticketInfo").innerHTML=`${out.booking.show_date} • ${out.booking.show_time}<br>Seats: ${out.booking.seats.join(", ")}<br>Total: ₹${out.booking.amount}`;
 },modal:{ondismiss:()=>{}}
 };
 new Razorpay(options).open();
}
document.getElementById("pay").onclick=()=>createOrder().catch(e=>alert(e.message));
</script></body></html>
