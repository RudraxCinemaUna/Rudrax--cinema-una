<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rudrax Cinema - Admin Booking</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0d12;color:#fff}
header{background:linear-gradient(135deg,#b40000,#ef2b2b);padding:18px 20px;font-weight:900}
main{max-width:1100px;margin:auto;padding:18px}.card{background:#151922;border:1px solid #292e3a;border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:#aeb5c3;margin-bottom:6px}
select,input{width:100%;padding:12px;border-radius:9px;border:1px solid #343a49;background:#0e1118;color:#fff}
button{border:0;border-radius:9px;padding:12px 14px;font-weight:800;cursor:pointer}
.primary{background:#16a34a;color:#fff}.danger{background:#dc2626;color:#fff}.secondary{background:#374151;color:#fff}
.seats{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
.seat{padding:9px 2px;font-size:11px;background:#eceff2;color:#111}.seat.selected{background:#22c55e}.seat.booked{background:#4b5563;color:#c7ccd6;cursor:not-allowed}
@media(max-width:600px){.seats{grid-template-columns:repeat(7,1fr)}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #292e3a}
.notice{padding:12px;border-radius:10px;background:#102819;border:1px solid #2f8a4b;margin-top:12px;display:none}
.small{color:#9ca3af;font-size:12px}
</style>
</head>
<body>
<header>🎬 RUDRAX CINEMA — ADMIN BOOKING PANEL</header>
<main>
<section class="card">
<h2>New Booking</h2>
<div class="grid">
<div><label>Movie</label><select id="movie"><option value="">Select Movie</option><option>AWARAPAN 2</option><option>JANA NAYAGAN</option></select></div>
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Show Time</label><select id="time">
<option>12:00 PM - 03:00 PM</option><option>03:00 PM - 06:00 PM</option>
<option>06:00 PM - 09:00 PM</option><option>09:00 PM - 12:00 AM</option>
</select></div>
<div><label>Customer Name</label><input id="name" placeholder="Customer name"></div>
<div><label>Mobile</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit number"></div>
</div>
<p class="small">Select seats. Grey seats are already booked for the selected movie/date/show.</p>
<div id="seats" class="seats"></div>
<div id="summary" class="small" style="margin-top:12px">No seats selected</div>
<div class="actions">
<button class="primary" onclick="saveBooking()">✅ Confirm Booking</button>
<button class="secondary" onclick="clearSelection()">Clear</button>
</div>
<div id="notice" class="notice"></div>
</section>

<section class="card">
<h2>Bookings</h2>
<div class="actions">
<button class="secondary" onclick="exportData()">Export Bookings</button>
<label style="display:inline-block"><input id="importFile" type="file" accept=".json" style="display:none" onchange="importData(event)"><button class="secondary" onclick="document.getElementById('importFile').click()">Import Bookings</button></label>
<button class="danger" onclick="clearAll()">Delete All Bookings</button>
</div>
<div style="overflow:auto;margin-top:12px"><table><thead><tr><th>ID</th><th>Customer</th><th>Movie</th><th>Date</th><th>Show</th><th>Seats</th><th>Total</th><th></th></tr></thead><tbody id="bookingRows"></tbody></table></div>
</section>
</main>
<script>
const KEY='rudraxCinemaBookingsV1';
const prices={Silver:150,Gold:200,Platinum:250};
const layout=[
 ['K','Silver',9,9],['J','Silver',9,9],['I','Silver',9,9],['H','Silver',9,9],
 ['G','Gold',9,9],['F','Gold',9,9],['E','Gold',9,9],['D','Gold',9,9],
 ['C','Gold',9,5],['B','Platinum',7,4],['A','Platinum',9,5]
];
let selected=new Set();
const $=id=>document.getElementById(id);
const today=new Date(); const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
$('date').min=iso(today); $('date').value=iso(today);

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a));}
function bookingKey(){return [$('movie').value,$('date').value,$('time').value].join('|')}
function bookedSeats(){
 const k=bookingKey(), s=new Set();
 load().filter(b=>b.key===k).forEach(b=>b.seats.forEach(x=>s.add(x)));
 return s;
}
function seatType(row){return layout.find(x=>x[0]===row)[1]}
function renderSeats(){
 selected.clear(); const booked=bookedSeats(); $('seats').innerHTML='';
 layout.forEach(([row,type,left,right])=>{
   for(let n=1;n<=left+right;n++){
     if(n===10 && right<9) continue;
     const b=document.createElement('button'); b.className='seat'; b.textContent=row+n;
     if(booked.has(row+n)){b.classList.add('booked');b.disabled=true}
     else b.onclick=()=>{if(selected.has(row+n)){selected.delete(row+n);b.classList.remove('selected')}else{selected.add(row+n);b.classList.add('selected')}updateSummary()};
     $('seats').appendChild(b);
   }
 });
 updateSummary();
}
function total(){
 let t=0; selected.forEach(id=>t+=prices[seatType(id[0])]); return t;
}
function updateSummary(){$('summary').textContent=selected.size?`${selected.size} seat(s): ${[...selected].sort()} • Total ₹${total()}`:'No seats selected'}
function clearSelection(){selected.clear();renderSeats()}
function show(msg){$('notice').textContent=msg;$('notice').style.display='block';setTimeout(()=>$('notice').style.display='none',3000)}
function saveBooking(){
 const movie=$('movie').value,date=$('date').value,time=$('time').value,name=$('name').value.trim(),mobile=$('mobile').value.trim();
 if(!movie)return show('Select a movie.');
 if(!date)return show('Select a date.');
 if(!name)return show('Enter customer name.');
 if(!/^\d{10}$/.test(mobile))return show('Enter a valid 10-digit mobile number.');
 if(!selected.size)return show('Select at least one seat.');
 const bs=bookedSeats(); for(const s of selected)if(bs.has(s))return show('One or more seats are already booked.');
 const id='RDX'+Math.floor(100000+Math.random()*900000);
 const b={id,key:bookingKey(),movie,date,time,name,mobile,seats:[...selected].sort(),total:total(),createdAt:new Date().toISOString()};
 const a=load();a.push(b);save(a);show(`Booking ${id} saved successfully.`);selected.clear();renderSeats();renderTable();
}
function renderTable(){
 $('bookingRows').innerHTML='';
 load().slice().reverse().forEach(b=>{
  const tr=document.createElement('tr');
  tr.innerHTML=`<td>${b.id}</td><td>${b.name}<br>${b.mobile}</td><td>${b.movie}</td><td>${b.date}</td><td>${b.time}</td><td>${b.seats.join(', ')}</td><td>₹${b.total}</td><td><button class="danger" onclick="removeBooking('${b.id}')">Delete</button></td>`;
  $('bookingRows').appendChild(tr);
 });
}
function removeBooking(id){save(load().filter(b=>b.id!==id));renderSeats();renderTable()}
function clearAll(){if(confirm('Delete all bookings?')){save([]);renderSeats();renderTable()}}
function exportData(){const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rudrax-bookings.json';a.click()}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;save(x);renderSeats();renderTable();show('Bookings imported.')}catch(_){show('Invalid booking file.')}};r.readAsText(f)}
$('movie').onchange=renderSeats;$('date').onchange=renderSeats;$('time').onchange=renderSeats;
renderSeats();renderTable();
</script>
</body>
</html>
